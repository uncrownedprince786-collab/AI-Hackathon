name: Publish daily AI article

# Adds one new dataset-backed markdown file under content/blog each day,
# together with the .published.json state that keeps generation idempotent.
# The article is built only from real dataset numbers; the generator's
# fact-check gate blocks any unsupported figure and it skips the day cleanly
# when no topic has enough data (exit 0). Pushing new files triggers the Vercel
# deployment.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  article:
    name: Write today's article
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate the article
        run: npx tsx scripts/generate-post.ts

      - name: Commit if a new file appeared
        run: |
          if [ -z "$(git status --porcelain content/blog)" ]; then
            echo "No new article today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog
          git commit -m "content: add daily AI article"
          git push
