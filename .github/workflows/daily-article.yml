name: Publish daily AI article

# Adds one new markdown file under content/blog each day. It only ever creates
# a file for today, never edits an existing one, and needs no API key: the
# article is assembled from templates and real dataset numbers. Pushing the new
# file triggers the Vercel deployment.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  article:
    name: Write today's article
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the article
        run: npx tsx scripts/generate-post.ts

      - name: Commit if a new file appeared
        run: |
          if [ -z "$(git status --porcelain content/blog)" ]; then
            echo "No new article today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog
          git commit -m "content: add daily AI article"
          git push
