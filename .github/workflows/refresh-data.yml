name: Refresh hackathon data

# Keeps the dataset fresh every 6 hours. The frontend serves the committed
# dataset (the runtime can only revalidate the cache, never persist), so this
# workflow runs the accuracy-engine refresh, commits the output and pushes —
# the Vercel Git integration then deploys it. Uses no secrets.
on:
  schedule:
    # minute 17 of every 6th hour, so it does not pile onto :00 with everyone else
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-hackathon-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Refresh dataset through the accuracy engine
        run: npm run refresh:data

      - name: Commit refreshed data
        run: |
          git config user.name "ai-hackathons-bot"
          git config user.email "84974365+ai-hackathons-bot[bot]@users.noreply.github.com"
          git add src/data/hackathons.json
          git commit -m "data: 6-hourly dataset refresh" && git push || echo "no data changes"