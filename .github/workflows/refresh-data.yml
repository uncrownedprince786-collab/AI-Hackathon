name: Refresh hackathon data

# The Vercel Hobby plan only allows one cron per day, so this workflow is what
# keeps the dataset fresh every 6 hours. It calls the same endpoint the site uses
# and the endpoint revalidates the cached pages afterwards.
on:
  schedule:
    # minute 17 of every 6th hour, so it does not pile onto :00 with everyone else
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-hackathon-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the live dataset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the refresh endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::SITE_URL is not set. Add it as an Actions secret (or repository variable)."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set. Add it as an Actions secret."
            exit 1
          fi

          url="${SITE_URL%/}/api/cron/refresh"
          echo "POST $url"

          status=$(curl -sS -o /tmp/refresh.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 540 \
            "$url")

          echo "HTTP $status"
          cat /tmp/refresh.json
          echo

          if [ "$status" != "200" ]; then
            echo "::error::Refresh failed with HTTP $status"
            exit 1
          fi
