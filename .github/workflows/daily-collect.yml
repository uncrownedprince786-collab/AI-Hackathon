name: Collect worldwide web sources

# RETIRED from the schedule on 2026-10-11: the open-web Puppeteer collector
# stopped completing in CI (one failure on Oct 8, then cancelled runs Oct 9-11)
# because the search engines it leans on block datacenter IPs. It produced ~2
# retained records in its lifetime. Kept as a MANUAL-ONLY tool: anyone can run
# it from the Actions tab, and the accuracy engine still folds the drafts in.
# Any records it produced stay in the dataset under each site's own name, and
# the sites are documented in meta.retiredSources so nothing reads as a
# silently stale active source. The 6-hour cadence is refresh-data.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Human-like web collector (events)
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
          SCRAPE_MAX_EVENTS: "80"
          SCRAPE_WINNERS: "0"
        run: npm run scrape:web

      - name: Refresh dataset through the accuracy engine
        run: npm run refresh:data

      - name: Enrich winner pages ("what they built")
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
          SCRAPE_MAX_EVENTS: "0"
          SCRAPE_MAX_WINNERS: "60"
        run: npm run scrape:web

      - name: Commit collected data
        run: |
          git config user.name "ai-hackathons-bot"
          git config user.email "84974365+ai-hackathons-bot[bot]@users.noreply.github.com"
          git add src/data/web-drafts.json src/data/winner-summaries.json src/data/hackathons.json
          git commit -m "data: worldwide web sources refresh" && git push || echo "no data changes"