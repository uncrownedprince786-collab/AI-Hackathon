name: Collect worldwide web sources

# Human-like Puppeteer collector for authentic global AI hackathons, followed
# by a data refresh through the accuracy engine. Runs behind the scenes only:
# the frontend receives the final clean dataset. Committing the collected data
# triggers the Vercel deployment.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Human-like web collector (events)
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
          SCRAPE_MAX_EVENTS: "80"
          SCRAPE_WINNERS: "0"
        run: npm run scrape:web

      - name: Refresh dataset through the accuracy engine
        run: npm run refresh:data

      - name: Enrich winner pages ("what they built")
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
          SCRAPE_MAX_EVENTS: "0"
          SCRAPE_MAX_WINNERS: "60"
        run: npm run scrape:web

      - name: Commit collected data
        run: |
          git config user.name "ai-hackathons-bot"
          git config user.email "84974365+ai-hackathons-bot[bot]@users.noreply.github.com"
          git add src/data/web-drafts.json src/data/winner-summaries.json src/data/hackathons.json
          git commit -m "data: worldwide web sources refresh" && git push || echo "no data changes"